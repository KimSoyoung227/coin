[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coin-calculator"
version = "0.11.19"
description = "암호화폐 수익률 계산기"
requires-python = ">=3.9"
dependencies = ["Flask>=3.1,<3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coin = ["translations.json", "data/*.json", "templates/*.xml", "templates/*.html", "static/*.css", "static/*.js"]
