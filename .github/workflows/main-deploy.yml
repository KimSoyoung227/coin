name: Deploy Python App to EC2
run-name: ${{ github.actor }} is zip the file and push to EC2 🚀

on:
  workflow_dispatch:
  push:
    branches:
      - main
      
permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"    
          
      - name: Package application
        run: |
          pip install -r requirements.txt --target ./libs
          tar -czf coin.tar.gz \
          --exclude=".git" \
          --exclude=".github" \
          --exclude=".venv" \
          --exclude="venv" \
          --exclude="__pycache__" \
          --exclude="coin.tar.gz" \
          .
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RPLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get GitHub Runner public IP
        id: runner-ip
        shell: bash
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $RUNNER_IP"

      - name: Allow SSH from GitHub Runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.runner-ip.outputs.runner_ip }}/32

      - name: Copy tar.gz EC2
       uses: appleboy/scp-action@master
       with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "coin.tar.gz"
        target: "/home/${{ secrets.EC2_USERNAME }}/app

      - namee: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USERNAME }}
         key: ${{ secrets.EC2_SSH_KEY }}
         script: |
            /home/${{ vars.EC2_USERNAME }}/app/deploy-coin.sh

      - name: Remove SSH rule
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ vars.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.runner-ip.outputs.runner_ip }}/32
            
